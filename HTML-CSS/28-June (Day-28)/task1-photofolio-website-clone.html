<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        * {
            margin: 0;
            padding: 0;
            font-family: "Poppins", sans-serif;
            background-color: rgb(31, 32, 37);
        }

        .navbar {
            height: 75px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
        }

        ul {
            display: flex;
            justify-content: space-around;
            align-items: center;
            gap: 60px;

        }

        li {
            list-style: none;
            color: white;
        }

        a {
            text-decoration: none;
            color: white;
        }

        a:hover {
            color: rgb(0, 194, 105);
        }

        #logo {
            display: flex;
            margin-left: 60px;
            display: inline;
            font-size: x-large;
            color: rgb(0, 194, 105) ;
        }

        #logo-text{
            margin-left: 10px;
            display: inline;
        }

        .social-links {
            display: flex;
            margin-right: 40px;
            gap: 15px;
            align-items: center;
        }

        .heading-section {
            height: 300px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: large;
        }

        span {
            color: rgb(0, 194, 105);
        }

        #sub-title {
            margin-top: 25px;
        }

        button {
            height: 40px;
            width: 100px;
            background-color: rgb(0, 194, 105);
            color: white;
            border: none;
        }

        img {
            height: 250px;
            width: 250px;
            object-fit: cover;
            border-radius: 8px;
        }

        .photos {
            margin-top: 50px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap:10px;
        }

       
    </style>
</head>

<body>
    <div class="container">
        <div class="navbar">
            <div class="logo">
                <i class="fa-solid fa-camera" id="logo"></i>
                <h2 id="logo-text">PhotoFolio</h2>
            </div>
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Gallery</a></li>
                <li><a href="#">Services</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
            <div class="social-links">
                <i class="fa-brands fa-twitter"></i>
                <i class="fa-brands fa-facebook"></i>
                <i class="fa-brands fa-instagram"></i>
            </div>
        </div>
        <div class="text-part">
            <div class="heading-section">
                <h1>I'm <span>Jenny Wilson</span></h1><br>
                <h1>Professional Photographer</h1>
                <p id="sub-title">Capturing beautiful moments thorugh creative photography</p><br>
                <button>Hire Me</button>
            </div>
        </div>
        <div class="photos">
            <img src="images/img1.jpg" alt="">
            <img src="images/img2.jpg" alt="">
            <img src="images/img3.jpg" alt="">
            <img src="images/img4.jpg" alt="">
            <img src="images/img5.jpg" alt="">
            <img src="images/img6.jpg" alt="">
            <img src="images/img7.jpg" alt="">
            <img src="images/img8.jpg" alt="">
            <img src="images/img10.jpg" alt="">
            <img src="images/img11.jpg" alt="">
        </div>
    </div>
    </div>
</body>

</html>

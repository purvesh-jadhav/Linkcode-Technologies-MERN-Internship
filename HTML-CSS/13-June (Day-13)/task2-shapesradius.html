<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>

body{
    background:#eee;
}


.shape{
    width:120px;
    height:120px;
    display:inline-block;
    margin:20px;
}



.s1{
    background:#ff4757;
    border-radius:20px;
}



.s2{
    background:#3742fa;
    border-radius:50%;
}


.s3{
    width:200px;
    background:#2ed573;
    border-radius:50px;
}


.s4{
    background:#ffa502;
    border-radius:100% 0 100% 0;
}

.s5{
    background:#9b59b6;
    border-radius:50% 20% 50% 20%;
}



.s6{
    background:#00cec9;
    border-radius:30px 80px 30px 80px;
}

.s7{
    background:#e84393;
    border-radius:100px 100px 0 0;
}

.s8{
    background:#e67e22;
    transform:rotate(45deg);
    border-radius:20px;
}

.s9{
    background:#3498db;
    border-radius:50% 50% 30% 30%;
}

.s10{
    background:#1abc9c;
    border-radius:70% 30% 80% 20%;
}


</style>

</head>


<body>


<div class="shape s1"></div>

<div class="shape s2"></div>

<div class="shape s3"></div>

<div class="shape s4"></div>

<div class="shape s5"></div>

<div class="shape s6"></div>

<div class="shape s7"></div>

<div class="shape s8"></div>

<div class="shape s9"></div>

<div class="shape s10"></div>


</body>
</body>
</html>

<!DOCTYPE html>

    <title>Find cube</title>
</head>
<body>
    <script>
        var num = Number(prompt("Enter number:"))

        console.log("Cube of number =",num*num*num);
        document.write("Cube of "+num+" is : "+(num*num*num))
        
    </script>

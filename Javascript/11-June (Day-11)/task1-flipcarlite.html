<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>FlipCart Lite</h1>
    <label for="price">Enter product price</label>
    <input type="number" id="price">
    <br><br>
    <label for="qn">Enter quamtity</label>
    <input type="number"  id="qn">
    <br><br>
    <button onclick="getBill()">Calculate Bill</button>
    <br><br>
    <button onclick="getDiscount10()">Apply 10% discount</button>
    <button onclick="getDiscount20()">Apply 20% discount</button>
    <button onclick="getDiscount30()">Apply 30% discount</button>
    <h2 id="result"></h2>

    <script>

        var price=document.getElementById("price")
        var qn=document.getElementById("qn")
        var result= document.getElementById("result")
        let totalBill=0

        function getBill(){
            totalBill=(price.value*qn.value)
            result.innerHTML="Total Bill: "+totalBill
        }

        function getDiscount10(){
            if(totalBill>1000){
                var discount = totalBill*0.10
                var finalBill=(totalBill-discount)
                result.innerHTML="Total Bill: "+totalBill+
                                 "<br>Discount of 10%: "+discount+
                                 "<br>Final Bill :"+finalBill+
                                 "<br><button> Proceed to Pay</button>"
            }
            else{
                alert("buy worth of rs. "+(1000-totalBill)+" to apply discount")
            }
        }

        function getDiscount20(){
            if(totalBill>2000){
                var discount = totalBill*0.20
                var finalBill=(totalBill-discount)
                result.innerHTML="Total Bill: "+totalBill+
                                 "<br>Discount of 20%: "+discount+
                                 "<br>Final Bill :"+finalBill+
                                 "<br><button> Proceed to Pay</button>"
            }
            else{
                alert("buy worth of rs. "+(2000-totalBill)+" to apply discount")
            }
        }

        function getDiscount30(){
            if(totalBill>3000){
                var discount = totalBill*0.30
                var finalBill=(totalBill-discount)
                result.innerHTML="Total Bill: "+totalBill+
                                 "<br>Discount of 30%: "+discount+
                                 "<br>Final Bill :"+finalBill+
                                 "<br><button> Proceed to Pay</button>"
            }
            else{
                alert("buy worth of rs. "+(3000-totalBill)+" to apply discount")
            }
        }

       //high order and callback function
        
    </script>
</body>
</html>

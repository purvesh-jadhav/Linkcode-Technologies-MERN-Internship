<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>find max among 3 numbers</title>
</head>
<body>
    <script>
        var num1=Number(prompt("Enter 1st number :"))
        var num2=Number(prompt("Enter 2nd number:"))
        var num3=Number(prompt("Enter 3rd number:"))
        console.log(num1>num2&&num1>num3?"max:"+num1:num2>num1&&num2>num3?"max:"+num2:"max:"+num3)
    </script>
</body>
</html>

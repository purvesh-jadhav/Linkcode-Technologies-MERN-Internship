<!DOCTYPE html>
<html>
<head>
<style>

.logo{
    width:200px;
    height:200px;
    background:linear-gradient(45deg,#ffd600,#ff0069,#d300c5,#7638fa);
    border-radius:40px;
    position:relative;
}


.box{
    width:100px;
    height:100px;
    border:15px solid white;
    border-radius:30px;
    position:absolute;
    top:35px;
    left:35px;
}


.circle{
    width:45px;
    height:45px;
    border:12px solid white;
    border-radius:50%;
    position:absolute;
    top:15px;
    left:15px;
}


.dot{
    width:20px;
    height:20px;
    background:white;
    border-radius:50%;
    position:absolute;
    right:5px;
    top:5px;
}

</style>
</head>

<body>

<div class="logo">
    <div class="box">
        <div class="circle"></div>
        <div class="dot"></div>
    </div>
</div>

</body>
</html>

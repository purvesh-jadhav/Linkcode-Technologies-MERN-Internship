<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Catalog</title>

    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
        rel="stylesheet">

    <style>
    
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #f6f0ef 0%, #e8dad8 100%);
            background-attachment: fixed;
            color: #3a2d2f;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }

        .container {
            width: 1200px;
            max-width: 100%;
            margin: auto;
            padding: 48px 24px;
        }

        /* Header Section styling */
        .header {
            text-align: left;
            margin-bottom: 36px;
        }

        .header h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 36px;
            font-weight: 800;
            color: #3a2d2f;
            margin-bottom: 8px;
            letter-spacing: -0.75px;
        }

        .header p {
            font-size: 16px;
            color: #8c7779;
            font-weight: 400;
        }

        /* Controls: Search & Sort Bar */
        .controls {
            display: flex;
            gap: 16px;
            margin-bottom: 40px;
        }

        .search-container {
            position: relative;
            flex-grow: 1;
        }

        #searchBar {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #dfcbca;
            border-radius: 12px;
            outline: none;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            color: #3a2d2f;
            background-color: #ffffff;
            box-shadow: 0 4px 12px rgba(141, 99, 104, 0.04);
            display: block;
            box-sizing: border-box;
        }

        /* Price Sort Dropdown Container */
        .select-container {
            position: relative;
            width: 220px;
          
        }

        .select-container select {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #dfcbca;
            border-radius: 12px;
            background-color: #ffffff;
            color: #7c686a;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(141, 99, 104, 0.04);
            display: block;
            box-sizing: border-box;
        }

        .card-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
            margin-bottom: 48px;
        }

        .card {
            background-color: #ffffff;
            border: 1px solid rgba(223, 203, 202, 0.5);
            border-radius: 24px;
            padding: 16px;
            box-shadow: 0 10px 30px -10px rgba(141, 99, 104, 0.1);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .image-container {
            width: 100%;
            aspect-ratio: 4 / 3;
            border-radius: 16px;
            overflow: hidden;
            background-color: #fdf5f5;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .content {
            padding: 16px 4px 0 4px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .category-badge {
            align-self: flex-start;
            display: inline-block;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #8d6368;
            background-color: #fdf5f5;
            border: 1px solid rgba(141, 99, 104, 0.15);
            padding: 4px 8px;
            border-radius: 6px;
            margin-bottom: 12px;
        }

        .content h2 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 18px;
            font-weight: 700;
            color: #3a2d2f;
            line-height: 1.3;
            margin-bottom: 4px;
        }

        .content h4 {
            font-size: 13px;
            font-weight: 500;
            color: #8c7779;
            margin-bottom: 12px;
        }

        .description {
            font-size: 13px;
            color: #8c7779;
            line-height: 1.5;
            margin-bottom: 20px;
            overflow: hidden;
            flex-grow: 1;
        }

        .card-footer {
            margin-top: auto;
            padding-top: 16px;
            border-top: 1px dashed rgba(223, 203, 202, 0.5);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .price-container {
            display: flex;
            align-items: center;
        }

        .price {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #3a2d2f;
        }

        .buy {
            background-color: #8d6368;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        /* 
        Responsive Breakpoints
        @media (max-width: 1024px) {
            .card-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 24px;
            }
        }

        @media (max-width: 768px) {
            .container {
                padding: 24px 16px;
            }
            .header h1 {
                font-size: 28px;
            }
        }

        @media (max-width: 640px) {
            .card-container {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .controls {
                flex-direction: column;
                gap: 12px;
            }
            .select-container {
                width: 100%;
            }
        } */
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>Products</h1>
            <p>Explore our premium collection of smartphones, laptops, cameras, and design accessories.</p>
        </div>

        <div class="controls">
            <div class="search-container">
                <input type="text" id="searchBar" placeholder="Search products by name or category...">
            </div>

            <div class="select-container">
                <select id="priceSort">
                    <option value="" disabled selected>Sort by Price</option>
                    <option value="low-to-high">Price: Low to High</option>
                    <option value="high-to-low">Price: High to Low</option>
                </select>
            </div>
        </div>

        <div id="products" class="card-container"></div>

    </div>

    <script>

        let card = document.getElementById("products");
        let search = document.getElementById("searchBar");
        let sort = document.getElementById("priceSort");

        let products = [
            {
                pname: "iPhone 15 Pro Max",
                cname: "Apple",
                category: "Mobile",
                desc: "A titanium design featuring the new A17 Pro chip and a custom 5x Telephoto camera.",
                price: "1199",
                img: "https://images.unsplash.com/photo-1510557880182-3d4d3cba35a5?w=600&auto=format&fit=crop&q=60"
            },
            {
                pname: "MacBook Pro 16\"",
                cname: "Apple",
                category: "Laptop",
                desc: "Powered by the Apple M3 Max chip with a stunning 16-inch Liquid Retina XDR display.",
                price: "2499",
                img: "https://images.unsplash.com/photo-1517336714731-489689fd1ca8?w=600&auto=format&fit=crop&q=60"
            },
            {
                pname: "Sony Alpha 7 IV",
                cname: "Sony",
                category: "Camera",
                desc: "Full-frame hybrid mirrorless camera offering outstanding stills and 4K movie recording.",
                price: "2299",
                img: "https://images.unsplash.com/photo-1516035069371-29a1b244cc32?w=600&auto=format&fit=crop&q=60"
            },
            {
                pname: "Bose QuietComfort Ultra",
                cname: "Boult",
                category: "Audio",
                desc: "World-class noise cancelling headphones with immersive spatial audio and premium comfort.",
                price: "379",
                img: "https://images.unsplash.com/photo-1546435770-a3e426bf472b?w=600&auto=format&fit=crop&q=60"
            },
            {
                pname: "Apple Watch Ultra 2",
                cname: "Apple",
                category: "Wearables",
                desc: "The ultimate sports watch with custom dual-frequency GPS and up to 36 hours of battery.",
                price: "799",
                img: "https://images.unsplash.com/photo-1434494878577-86c23bcb06b9?w=600&auto=format&fit=crop&q=60"
            },
            {
                pname: "Keychron Q1 Pro",
                cname: "Zebronics",
                category: "Accessories",
                desc: "Full metal QMK/VIA custom wireless mechanical keyboard with double-shot PBT keycaps.",
                price: "199",
                img: "https://images.unsplash.com/photo-1618384887929-16ec33fab9ef?w=600&auto=format&fit=crop&q=60"
            },
            {
                pname: "iPad Pro 12.9\"",
                cname: "Apple",
                category: "Tablet",
                desc: "Ultra-thin design featuring the breakthrough OLED Liquid Retina XDR display and M4 chip.",
                price: "1099",
                img: "https://images.unsplash.com/photo-1544244015-0df4b3ffc6b0?w=600&auto=format&fit=crop&q=60"
            },
            {
                pname: "Sonos Move 2",
                cname: "JBL",
                category: "Audio",
                desc: "Powerful portable smart speaker with upgraded stereo sound and 24 hours of playback.",
                price: "449",
                img: "https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?w=600&auto=format&fit=crop&q=60"
            }
        ];


        function display(list) {

            card.innerHTML = "";

            list.forEach((product) => {

                let div = document.createElement("div");

                div.className = "card";

                div.innerHTML = `
            <div class="image-container">
                <img src="${product.img}">
            </div>

            <div class="content">
                <span class="category-badge">
                    ${product.category}
                </span>

                <h2>${product.pname}</h2>

                <h4>${product.cname}</h4>

                <p class="description">
                    ${product.desc}
                </p>

                <div class="card-footer">

                    <div class="price-container">
                        <span class="price">
                            ₹${product.price}
                        </span>
                    </div>

                    <button class="buy">
                        Buy Now
                    </button>

                </div>
            </div>
        `;

                card.appendChild(div);

            });

        }

        document.addEventListener("input", () => {

            let searchval = search.value.toLowerCase();

            let filtered = products.filter((pr) => {

                return (
                    pr.pname.toLowerCase().includes(searchval) ||
                    pr.cname.toLowerCase().includes(searchval) ||
                    pr.category.toLowerCase().includes(searchval)
                );

            });

            let sortval = sort.value;

            if (sortval == "low-to-high") {

                filtered.sort((a, b) => {
                    return Number(a.price) - Number(b.price);
                });

            }

            if (sortval == "high-to-low") {

                filtered.sort((a, b) => {
                    return Number(b.price) - Number(a.price);
                });

            }

            display(filtered);

        });
        display(products);
    </script>

</body>

</html>

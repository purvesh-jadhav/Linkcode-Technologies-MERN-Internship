<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wap To To Get Pass As Marks Are Greter Than 40</title>
</head>
<body>
    <h1>Wap To To Get Pass As Marks Are Greter Than 40</h1>
    <script>
        var marks = Number(prompt("enter your marks: "));

        document.write("<br>your marks: "+marks);

        if(marks>40){
            document.write("pass");
        }
        else{
            document.write("fail");
        }
    </script>
</body>
</html>

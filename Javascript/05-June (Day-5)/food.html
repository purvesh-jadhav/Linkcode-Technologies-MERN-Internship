<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Of Food Items</title>
</head>
<body>
    <h1>Menu Of Food Items</h1>
    <script>
        var ch = Number(prompt("enter the fodd item you want: \n1.gulabjamun\n2.rasmalai\n3.fruitcustard\n4besanchakki\n5.lassi\n6.laduu"));

        switch(ch){
            case 1: document.write("gulabjamun");
            break;
            case 2: document.write("rasmalai");
            break;
            case 3: document.write("fruitcustrad");
            break;
            case 4: document.write("besanchakki");
            break;
            case 5: document.write("lassi");
            break;
            case 6: document.write("laduu");
            break;
            default: document.write("invalid choice!")
        }
    </script>
</body>
</html>

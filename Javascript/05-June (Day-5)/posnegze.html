<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wap To Check Whether Number Is Positive Negative Or Zero</title>
</head>
<body>
    <h1>Wap To Check Whether Number Is Positive Negative Or Zero</h1>
        <script>
            var num = Number(prompt("enter your number: "));
          if(num>0){
            document.write("positive");
          }
          else if(num==0)
          {
            document.write("zero");
          }
          else{
            document.write("negative");
          }
        
        </script>
</body>
</html>

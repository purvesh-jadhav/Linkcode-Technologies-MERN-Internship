<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wap To Check Whether Number Is Even Or Odd</title>
</head>
<body>
    <h1>Wap To Check Whether Number Is Even Or Odd</h1>
    <script>
        var num = Number(prompt("enter your number: "));

        document.write("your number: "+num);

        if(num%2==0){
            document.write("<br>your number is even");
        }
        else{
            document.write("<br>your number is odd");

        }
    </script>
</body>
</html>

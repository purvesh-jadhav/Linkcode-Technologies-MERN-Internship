<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Wap To Check The Year Is Leap Year Or Not</title>
</head>
<body>
    <h1>Wap To Check The Year Is Leap Year Or Not</h1>
    <script>
        var year = Number(prompt("enter the year: "))
        if(year%4==0){
            document.write("it is a leap year");
        }
        else{
            document.write("it is not a leap year");
        }
    </script>
</body>
</html>

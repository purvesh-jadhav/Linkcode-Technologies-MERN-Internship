<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vowels Check</title>
</head>
<body>
    <h1>Vowels Check</h1>
    <script>
        var ch = Number(prompt("enter the character: \n1.a\n2.e\n3.i\n4.o\n5.u"));

        switch(ch){
            case 1:document.write("a");
            break;
            case 2:document.write("e");
            break;
            case 3:document.write("i");
            break;
            case 4:document.write("o");
            break;
            case 5:document.write("u");
            break;
           
        }
    </script>
</body>
</html>

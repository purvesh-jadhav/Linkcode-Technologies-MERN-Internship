<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wap To Check Whether The No Is Postive Even</title>
</head>
<body>
    <h1>Wap To Check Whether The No Is Postive Even</h1>
    <script>
        var num = Number(prompt("enter your number: "));

        if(num%2==0 && num>0){
            document.write("positive even");
        }
        else if(num==0){
            document.write("zero")
        }
        else{
            document.write("it is not positive even");
        }

          
        
           

        

    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day Names</title>
</head>
<body>
    <h1>Day Names</h1>
    <script>
        var ch = Number(prompt("enter the day: \n1.monday\n2.tuesday\n3.wednesday\n4.thursday\n5.friday\n6.saturday\n7..sunday"));
        switch(ch){
            case 1:document.write("<br>monday");
            break;
            case 2: document.write("<br>tuedsay");
            break;
            case 3:document.write("<br>wednesday");
            break;
            case 4:document.write("<br>thursday");
            break;
            case 5:document.write("<br>friday");
            break;
            case 6:document.write("<br>saturday");
            break;
            case 7:document.write("<br>sunday");
            break;
            default:document.write("<br>invalid choice...!");
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Wap To Check Whether Number Is Divisible By 5 Or Not</title>
</head>
<body>
    <h1>Wap To Check Whether Number Is Divisible By 5 Or Not</h1>
    <script>
        var num = Number(prompt("enter your number: "));

        document.write("your number is: ",+num);

        if(num%5==0){
            document.write("<br>number is divisible by 5");
        }
        else{
            document.write("<br>number is not divisble by 5")
        }
    </script>
</body>
</html>

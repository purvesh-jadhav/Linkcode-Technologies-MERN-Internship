<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wap To Check Whether Character Is Vowel Or Consonant</title>
</head>
<body>
    <h1>Wap To Check Whether Character Is Vowel Or Consonant</h1>
    <script>
        var ch = prompt("enter your character : ");

        if(ch = 'a','e','i','o','u'){
            document.write("it is a vowel");
        }
        else{
            document.write("it is a consonant");
        }
        
    </script>
</body>
</html>

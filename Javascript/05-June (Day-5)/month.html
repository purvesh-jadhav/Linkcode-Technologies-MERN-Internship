<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Month Names</title>
</head>
<body>
    <h1>Month Names</h1>
    <script>
     var ch = Number(prompt("enter the month: \n1.january\n2.february\n3.march\n4.april\n5.may\n6.june\n7.july\n8.august\n9.september\n10.october\n11.november\n12.december"));

        switch(ch){
            case 1:document.write("<br>january");
            break;
            case 2: document.write("<br>february");
            break;
            case 3:document.write("<br>march");
            break;
            case 4:document.write("<br>april");
            break;
            case 5:document.write("<br>may");
            break;
            case 6:document.write("<br>june");
            break;
            case 7:document.write("<br>july");
            break;
            case 8:document.write("<br>august");
            break;
            case 9:document.write("<br>september");
            break;
            case 10:document.write("<br>october");
            break;
            case 11:document.write("<br>november");
            break;
            case 12:document.write("<br>december");
            break;
            default:document.write("<br>invalid choice...!");
        }
        </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FInd max among 2 numbers</title>
</head>
<body>
    <script>
        var num1=Number(prompt("Enter 1st number :"))
        var num2=Number(prompt("Enter 2nd number:"))
        console.log(num1>num2?"max:"+num1:"max:"+num2)
        
    </script>
</body>
</html>
